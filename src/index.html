<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KanbanFlow</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Kanban<span>Flow</span></h1>
      <p>Mini-tablero Kanban para equipos ágiles</p>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <form id="task-form" class="panel">
          <h2>Nueva tarea</h2>
          <label>Título <input name="title" required maxlength="80" /></label>
          <label>Descripción <textarea name="description" rows="2" maxlength="200"></textarea></label>
          <label>Responsable <input name="assignee" placeholder="usuario_01" /></label>
          <label>Prioridad
            <select name="priority">
              <option value="baja">Baja</option>
              <option value="media" selected>Media</option>
              <option value="alta">Alta</option>
            </select>
          </label>
          <button type="submit">Crear tarea</button>
        </form>

        <div class="panel">
          <h2>Alertas</h2>
          <ul id="alerts" class="alerts"></ul>
        </div>
      </aside>

      <div id="board" class="board"></div>
    </main>

    <script type="module" src="main.js"></script>
  </body>
</html>
