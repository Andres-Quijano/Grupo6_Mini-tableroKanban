<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mini-tablero Kanban</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Mini-tablero <span>Kanban</span></h1>
      <p>Grupo 6 · Gestión de tareas ágiles con límites WIP, DoR y DoD</p>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <form id="task-form" class="panel" novalidate>
          <h2 data-role="title">Nueva tarea</h2>
          <label>Título <input name="title" required maxlength="80" /></label>
          <label>Descripción <textarea name="description" rows="2" maxlength="200"></textarea></label>
          <label>Responsable <input name="assignee" placeholder="usuario_01" maxlength="40" /></label>
          <label>Prioridad
            <select name="priority">
              <option value="baja">Baja</option>
              <option value="media" selected>Media</option>
              <option value="alta">Alta</option>
            </select>
          </label>
          <p class="form-error" data-role="error" role="alert" hidden></p>
          <div class="form-actions">
            <button type="submit">Crear tarea</button>
            <button type="button" class="secondary" data-role="cancel" hidden>Cancelar</button>
          </div>
        </form>

        <div class="panel">
          <h2>Notificaciones</h2>
          <ul id="alerts" class="alerts" aria-live="polite"></ul>
        </div>
      </aside>

      <div id="board" class="board"></div>
    </main>

    <script type="module" src="main.js"></script>
  </body>
</html>
